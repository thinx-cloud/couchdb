version: 2.1

orbs:
  docker: circleci/docker@2.8.0

jobs:
  ggshield-scan:
    docker:
      - image: gitguardian/ggshield:latest
    environment:
      CIRCLE_RANGE: <<pipeline.git.base_revision>>...<<pipeline.git.revision>>
    steps:
      - checkout:
          method: full
      - run: ggshield secret scan -v ci

workflows:
  build-and-publish:
    jobs:
      - ggshield-scan:
          name: Scan using Gitguardian shield
          context:
            - gitguardian

      - docker/publish:
          name: Build and Publish to Docker Hub
          image: thinxcloud/couchdb
          tag: "$CIRCLE_SHA1,latest"
          before_build:
            - run:
                name: Log in to dhi.io for the hardened base image
                command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin dhi.io
          filters:
            branches:
              only: main
          context:
            - dockerhub
