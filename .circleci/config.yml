version: 2.1

orbs:
  docker: circleci/docker@2.8.0

jobs:
  ggshield-scan:
    docker:
      - image: gitguardian/ggshield:v1.54.0@sha256:5666b10fc479e8baba3aeb9c42d9537cddd0df79fd6b4502397925690f1b4105
        auth:
          username: $DOCKER_LOGIN
          password: $DOCKER_PASSWORD
    environment:
      CIRCLE_RANGE: <<pipeline.git.base_revision>>...<<pipeline.git.revision>>
    steps:
      - checkout:
          method: full
      - run: ggshield secret scan -v ci

workflows:
  build-and-publish:
    jobs:
      - ggshield-scan:
          name: Scan using Gitguardian shield
          context:
            - gitguardian
            - dockerhub

      - docker/publish:
          name: Build and Publish to Docker Hub
          image: thinxcloud/couchdb
          tag: "$CIRCLE_SHA1,latest"
          before_build:
            - run:
                name: Log in to dhi.io for the hardened base image
                command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin dhi.io
          filters:
            branches:
              only: main
          context:
            - dockerhub
